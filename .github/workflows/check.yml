name: Digitalbonus Watcher (Hourly Status)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check page
        id: check
        run: |
          RESULT=$(python check_page.py)
          echo "RESULT=$RESULT" >> $GITHUB_ENV

      - name: Notify Telegram
        run: |
          if [ "${{ env.RESULT }}" = "UNCHANGED" ]; then
            MESSAGE="❌ Digitalbonus Bayern: Hinweis *unverändert* (Anträge weiterhin nicht möglich)."
          else
            MESSAGE="✅ Digitalbonus Bayern: Hinweis *verändert* – Antragstellung vermutlich geöffnet oder aktualisiert."
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
